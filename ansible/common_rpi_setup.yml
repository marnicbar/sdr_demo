- name: Make sure everything is up to date
  ansible.builtin.apt:
    upgrade: dist
    update_cache: true

- name: Check if a reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required_file

- name: Reboot if required
  ansible.builtin.reboot:
  when: reboot_required_file.stat.exists

- name: Install packages
  ansible.builtin.apt:
    pkg:
      - git
      - gnuradio
      - xterm

- name: Pull the latest code from the repository
  become: false
  ansible.builtin.git:
    repo: 'https://github.com/marnicbar/sdr_demo.git'
    dest: /home/{{ ansible_user }}/sdr_demo
    version: main

- name: Ensure user systemd directory exists
  ansible.builtin.file:
    path: /home/{{ ansible_user }}/.config/systemd/user
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
