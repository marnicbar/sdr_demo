---
- name: Setup a Raspberry Pi as the receiver node
  hosts: receiver_pi
  become: true

  tasks:
    - name: Include common Raspberry Pi setup tasks
      ansible.builtin.import_tasks:
        file: common_rpi_setup.yml

    - name: Configure the system to run the receiver script on boot
      ansible.builtin.copy:
        dest: /home/{{ ansible_user }}/.config/systemd/user/receiver.service
        content: |
          [Unit]
          Description=SDR Receiver GUI Service
          After=graphical-session.target network.target
          Wants=graphical-session.target network.target

          [Service]
          ExecStart=/home/{{ ansible_user }}/sdr_demo/run_receiver.sh --fullscreen
          WorkingDirectory=/home/{{ ansible_user }}/sdr_demo
          Restart=always
          Environment=DISPLAY=:0
          Environment=XAUTHORITY=/home/{{ ansible_user }}/.Xauthority
          StandardOutput=append:/home/{{ ansible_user }}/sdr_demo/receiver.log
          StandardError=append:/home/{{ ansible_user }}/sdr_demo/receiver.log

          [Install]
          WantedBy=default.target
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'

    - name: Reload the user systemd daemon to recognize the new service restart it and enable it to start on boot
      ansible.builtin.systemd:
        name: receiver.service
        daemon_reload: true
        state: restarted
        enabled: true
        scope: user
      become: true
      become_user: "{{ ansible_user }}"
