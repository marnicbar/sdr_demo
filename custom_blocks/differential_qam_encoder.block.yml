id: differential_qam_encoder
label: Differential QAM Encoder
category: '[Custom]'

parameters:
  - id: order
    label: QAM Order
    dtype: enum
    options: [qam.QAM4, qam.QAM16, qam.QAM64, qam.QAM256]
    option_labels: ["4-QAM", "16-QAM", "64-QAM", "256-QAM"]
    default: qam.QAM4

inputs:
  - domain: stream
    dtype: byte

outputs:
  - domain: stream
    dtype: byte

templates:
  imports: from differential_qam_encoder.differential_qam_encoder import differential_qam_encoder
  make: differential_qam_encoder(order=${order})

file_format: 1