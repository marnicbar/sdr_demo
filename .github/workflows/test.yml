  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    container: gnuradio/ci:ubuntu-24.04-3.10

    steps:
    - uses: actions/checkout@v4
    
    # - name: Install dependencies
