name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install gnuradio

    - name: Run tests
      run: |
        python3 -m unittest discover -s custom_blocks -p 'test_*.py' -v
